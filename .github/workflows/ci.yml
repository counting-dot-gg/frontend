name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cp .env.example .env.local
      - run: npx next build

  regional:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: harness
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pharness"
          --health-interval 5s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      MYSQL_DB_HOST: 127.0.0.1
      MYSQL_DB_PORT: "3306"
      MYSQL_DB_USERNAME: root
      MYSQL_DB_PASSWORD: harness
      HARNESS_REDIS_URL: redis://127.0.0.1:6379/9
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          path: frontend
      - uses: actions/checkout@v7
        with:
          repository: counting-dot-gg/backend
          path: backend
      - run: rustup toolchain install && rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install the worker and the suite
        run: |
          npm ci --prefix workers/do-poc
          npm ci --prefix e2e/regional

      - name: Build
        run: cargo build --release --locked -p cgg-socket -p cgg-harness

      - name: Regional suite
        run: target/release/cgg-harness regional --socket-bin target/release/cgg-socket --frontend ../frontend

      - name: Keep the logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: regional-logs
          path: backend/target/regional/**/*.log
